name: Review merge verify

on:
  push:
    branches: [review/rick-dev-merge]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npx tsc --noEmit
      - run: npm run check
      - run: node --test --test-concurrency=1 scripts/*.test.mjs
      - run: node scripts/local-sandbox.mjs verify --instance review-merge-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-merge-${{ github.run_id }}
          path: |
            .tmp/local-sandboxes/*/verification-*.json
            .tmp/local-sandboxes/*/lifecycle.json
            .tmp/local-sandboxes/*/server.log
          if-no-files-found: ignore
