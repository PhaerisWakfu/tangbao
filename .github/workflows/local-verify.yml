name: Local verify

# 手动运行：Actions → Local verify → Run workflow。
# 在 Linux 上跑隔离实例的完整 HTTP 回归，避免 Windows 本地 Miniflare 的目录权限问题。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npx tsc --noEmit
      - run: npm run check
      - run: node scripts/local-sandbox.mjs verify --instance ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-verify-${{ github.run_id }}
          path: |
            .tmp/local-sandboxes/*/verification-*.json
            .tmp/local-sandboxes/*/lifecycle.json
            .tmp/local-sandboxes/*/server.log
          if-no-files-found: ignore
