<!DOCTYPE html>
<!-- 意图：给「褶子星芒」找形。远看要像大模型的标志，近看是包子顶上捏出来的褶。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>褶子星芒 · 找形</title>
  <style>
    body {
      margin: 0;
      padding: 28px;
      background: #faf9f6;
      color: #1f1d1a;
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    figure {
      margin: 0;
      padding: 18px 12px 10px;
      display: grid;
      justify-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e9e5dd;
      border-radius: 14px;
    }
    .sizes { display: flex; align-items: center; gap: 18px; color: #a8622a; }
    .ink { color: #1f1d1a; }
    figcaption { color: #7a746b; font-size: 12px; }
    h2 { margin: 26px 0 12px; font-size: 13px; font-weight: 600; color: #7a746b; }
    h2:first-child { margin-top: 0; }
  </style>
</head>
<body>
  <h2>第一轮：等粗的褶</h2>
  <div class="grid" id="grid"></div>
  <h2>第二轮：收尖的褶，外粗内细</h2>
  <div class="grid" id="grid2"></div>
  <script>
    function pleat({ n, r1, r2, twist, bow, lift = 0.8 }) {
      const rad = Math.PI / 180;
      const p = (r, a) => (12 + r * Math.cos(a)).toFixed(2) + " " + (12 + r * Math.sin(a)).toFixed(2);
      let d = "";
      for (let i = 0; i < n; i++) {
        const t = (i * 360 / n - 90) * rad;
        d += "M" + p(r1, t) + "Q" + p((r1 + r2) / 2 + lift, t + twist * bow * rad) + " " + p(r2, t + twist * rad);
      }
      return d;
    }
    const variants = [
      { name: "A 8 褶 30°", n: 8, r1: 2.4, r2: 9.6, twist: 30, bow: 0.3, w: 1.7 },
      { name: "B 10 褶 40°", n: 10, r1: 2.3, r2: 9.6, twist: 40, bow: 0.35, w: 1.7 },
      { name: "C 12 褶 50°", n: 12, r1: 2.2, r2: 9.6, twist: 50, bow: 0.4, w: 1.5 },
      { name: "D 10 褶 70°", n: 10, r1: 2.0, r2: 9.6, twist: 70, bow: 0.5, w: 1.6 },
      { name: "E 9 褶 35° 加结", n: 9, r1: 2.8, r2: 9.6, twist: 35, bow: 0.25, w: 1.7, dot: 1.2 },
      { name: "F 14 褶 45° 细", n: 14, r1: 2.6, r2: 9.8, twist: 45, bow: 0.35, w: 1.2 },
      { name: "G 6 褶 20°", n: 6, r1: 2.2, r2: 9.6, twist: 20, bow: 0.3, w: 1.9 },
      { name: "H 10 褶 40° 大孔", n: 10, r1: 3.4, r2: 9.6, twist: 40, bow: 0.35, w: 1.7 },
      { name: "I 11 褶 55° 加结", n: 11, r1: 2.6, r2: 9.6, twist: 55, bow: 0.45, w: 1.5, dot: 1.4 },
      { name: "J 16 褶 30° 光圈", n: 16, r1: 3.2, r2: 9.8, twist: 30, bow: 0.3, w: 1.1 },
      { name: "K 10 褶 40° 带包身", n: 10, r1: 2.3, r2: 8.4, twist: 40, bow: 0.35, w: 1.6, ring: 10.6 },
      { name: "L 7 褶 45° 弯", n: 7, r1: 2.2, r2: 9.6, twist: 45, bow: 0.6, w: 1.8 },
    ];
    const grid = document.getElementById("grid");
    for (const v of variants) {
      const d = pleat(v);
      const icon = (size, cls = "") =>
        `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${v.w}" stroke-linecap="round">` +
        `<path d="${d}"/>` +
        (v.dot ? `<circle cx="12" cy="12" r="${v.dot}" fill="currentColor" stroke="none"/>` : "") +
        (v.ring ? `<circle cx="12" cy="12" r="${v.ring}" stroke-width="${v.w * 0.7}" opacity=".45"/>` : "") +
        `</svg>`;
      const fig = document.createElement("figure");
      fig.innerHTML =
        `<div class="sizes">${icon(72)}${icon(30)}${icon(18)}${icon(30, "ink")}</div>` +
        `<figcaption>${v.name}</figcaption>`;
      grid.append(fig);
    }

    function taper({ n, r1, r2, twist, bow, width, lift = 0.6 }) {
      const rad = Math.PI / 180;
      const p = (r, a) => (12 + r * Math.cos(a)).toFixed(2) + " " + (12 + r * Math.sin(a)).toFixed(2);
      const half = (width / 2 / r2) / rad;
      let d = "";
      for (let i = 0; i < n; i++) {
        const t = (i * 360 / n - 90) * rad;
        const e = t + twist * rad;
        const c = t + twist * bow * rad;
        const rc = (r1 + r2) / 2 + lift;
        d +=
          "M" + p(r1, t) +
          "Q" + p(rc + width * 0.35, c - half * rad * 0.6) + " " + p(r2, e - half * rad) +
          "A" + (width / 2).toFixed(2) + " " + (width / 2).toFixed(2) + " 0 0 1 " + p(r2, e + half * rad) +
          "Q" + p(rc - width * 0.35, c + half * rad * 0.6) + " " + p(r1, t) + "Z";
      }
      return d;
    }
    const tapered = [
      { name: "T1 8 褶 40°", n: 8, r1: 1.6, r2: 10, twist: 40, bow: 0.35, width: 2.6 },
      { name: "T2 9 褶 45° 加结", n: 9, r1: 2.4, r2: 10, twist: 45, bow: 0.4, width: 2.4, dot: 1.3 },
      { name: "T3 10 褶 50°", n: 10, r1: 1.8, r2: 10, twist: 50, bow: 0.42, width: 2.2 },
      { name: "T4 7 褶 55°", n: 7, r1: 1.4, r2: 10, twist: 55, bow: 0.45, width: 3 },
      { name: "T5 12 褶 40° 细", n: 12, r1: 2.6, r2: 10, twist: 40, bow: 0.38, width: 1.8 },
      { name: "T6 6 褶 35°", n: 6, r1: 1.2, r2: 10, twist: 35, bow: 0.3, width: 3.4 },
      { name: "T7 9 褶 65° 拧紧", n: 9, r1: 2, r2: 10, twist: 65, bow: 0.5, width: 2.4 },
      { name: "T8 10 褶 45° 加结", n: 10, r1: 2.8, r2: 10, twist: 45, bow: 0.4, width: 2.1, dot: 1.5 },
    ];
    const grid2 = document.getElementById("grid2");
    for (const v of tapered) {
      const d = taper(v);
      const icon = (size, cls = "") =>
        `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor">` +
        `<path d="${d}"/>` +
        (v.dot ? `<circle cx="12" cy="12" r="${v.dot}"/>` : "") +
        `</svg>`;
      const fig = document.createElement("figure");
      fig.innerHTML =
        `<div class="sizes">${icon(72)}${icon(30)}${icon(18)}${icon(30, "ink")}</div>` +
        `<figcaption>${v.name}</figcaption>`;
      grid2.append(fig);
    }
  </script>
</body>
</html>
