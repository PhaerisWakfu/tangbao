<!DOCTYPE html>
<!-- 意图：极简。远看只是一条对话栏。人工只留在输入框下面那一行小字。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>糖包</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --ink: #1c1b19;
      --muted: #8d877e;
      --faint: #b7b1a8;
      --line: #e5e1d8;
      --panel: #fffcf9;
      --col: 40rem;
      --fine: 12px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: -0.011em;
    }
    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding-bottom: 2.6rem;
    }
    .thread {
      flex: 1;
      width: min(var(--col), calc(100% - 2rem));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0 1rem;
    }
    .thread.has-log { justify-content: flex-start; padding-top: 2.5rem; }
    .hello { text-align: center; }
    .hello h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2rem);
      font-weight: 560;
      letter-spacing: -0.03em;
    }
    .log { display: flex; flex-direction: column; gap: 1.35rem; }
    .msg { display: grid; gap: 0.3rem; }
    .msg b {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }
    .msg p { margin: 0; line-height: 1.65; font-size: 1rem; white-space: pre-wrap; }
    .wait { color: var(--muted); font-size: 0.92rem; }
    .dock {
      width: min(var(--col), calc(100% - 2rem));
      margin: 0 auto 1.25rem;
    }
    form.composer {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      padding: 0.55rem 0.55rem 0.55rem 0.9rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 1px 0 rgba(28, 27, 25, 0.03);
    }
    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 1.5;
      max-height: 8rem;
      padding: 0.4rem 0;
    }
    button.send {
      border: 0;
      background: var(--ink);
      color: #fff;
      width: 2rem;
      height: 2rem;
      border-radius: 9px;
      cursor: pointer;
    }
    button.send:disabled { opacity: 0.35; cursor: default; }
    .fine {
      margin: 0.55rem 0 0;
      text-align: center;
      font-size: var(--fine);
      line-height: 1.45;
      color: var(--faint);
    }
    .fine em { font-style: normal; font-size: 0.92em; }
    .playground {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
      padding: 0.4rem 0.9rem;
      background: #fff;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      z-index: 5;
    }
    .playground label { display: flex; align-items: center; gap: 0.35rem; }
  </style>
</head>
<body>
  <div class="app">
    <main class="thread" id="thread">
      <div class="hello" id="hello">
        <h1>需要我做什么？</h1>
      </div>
      <div class="log" id="log" hidden></div>
    </main>
    <div class="dock">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="给糖包发消息"></textarea>
        <button class="send" type="submit" aria-label="发送" disabled>↑</button>
      </form>
      <p class="fine">糖包也会犯错。重要的事请自己判断。<br><em>这里的 AI 是人工，回复的是一个叫糖包的人。</em></p>
    </div>
  </div>
  <form class="playground" id="playground">
    <span>稿面</span>
    <label>背景 <input type="color" value="#f7f6f3" data-var="--bg"></label>
    <label>字色 <input type="color" value="#1c1b19" data-var="--ink"></label>
    <label>栏宽 <input type="range" min="28" max="52" value="40" data-var="--col" data-unit="rem"></label>
    <label>小字 <input type="range" min="10" max="15" value="12" data-var="--fine" data-unit="px"></label>
  </form>
  <script>
    const root = document.documentElement;
    const thread = document.getElementById("thread");
    const hello = document.getElementById("hello");
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const send = document.querySelector(".send");
    const composer = document.getElementById("composer");

    document.getElementById("playground").oninput = (e) => {
      const el = e.target;
      if (!el.dataset.var) return;
      const unit = el.dataset.unit || "";
      root.style.setProperty(el.dataset.var, el.value + unit);
    };

    const grow = () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 128) + "px";
      send.disabled = !input.value.trim();
    };
    input.addEventListener("input", grow);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        composer.requestSubmit();
      }
    });

    function add(role, text) {
      hello.hidden = true;
      log.hidden = false;
      thread.classList.add("has-log");
      const item = document.createElement("article");
      item.className = "msg";
      const who = document.createElement("b");
      who.textContent = role;
      const body = document.createElement("p");
      body.textContent = text;
      item.append(who, body);
      log.append(item);
    }

    composer.onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add("你", text);
      input.value = "";
      grow();
      const wait = document.createElement("p");
      wait.className = "wait";
      wait.textContent = "思考中";
      log.append(wait);
    };
  </script>
</body>
</html>
