<!DOCTYPE html>
<!--
意图：极简。只留名字、学名和一句事实：回复你的是一个真人。别的都不解释，让人自己点进去。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>糖包 · 10 一句话</title>
  <style>
    @font-face {
      font-family: "TB Serif";
      src: url("../assets/tb-serif.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }
    :root {
      --bg: #fcfbf9;
      --side: #f4f2ee;
      --panel: #ffffff;
      --ink: #1f1d1a;
      --ink-2: #48443e;
      --muted: #7a746b;
      --faint: #aaa49a;
      --line: #e9e5dd;
      --accent: #a8622a;
      --dot: #4b8a5f;
      --serif: "TB Serif", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color-scheme: light;
    }
    body[data-presence="asleep"] {
      --bg: #1b1815;
      --side: #211d19;
      --panel: #29241f;
      --ink: #f1e9dc;
      --ink-2: #d6ccbd;
      --muted: #a49886;
      --faint: #7c7264;
      --line: #36302a;
      --accent: #d08b4d;
      --dot: #8f7b57;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    svg.mark { display: block; color: var(--accent); }
    .bun { position: relative; width: 60px; height: 60px; margin: 0 auto 22px; }
    .bun svg.mark { width: 60px; height: 60px; transition: opacity 0.7s ease; }
    svg.steam {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 2px);
      width: 46px;
      height: 32px;
      transform: translateX(-50%);
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.8;
      stroke-linecap: round;
      overflow: visible;
    }
    svg.steam path { opacity: 0; animation: steam 3.6s ease-in-out infinite; }
    svg.steam path:nth-child(1) { animation-delay: -0.6s; }
    svg.steam path:nth-child(2) { animation-delay: -1.8s; }
    svg.steam path:nth-child(3) { animation-delay: -3s; }
    body[data-presence="asleep"] svg.steam { display: none; }
    body[data-presence="asleep"] .bun svg.mark { opacity: 0.5; }
    @keyframes steam {
      0% { opacity: 0; transform: translateY(6px); }
      35% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-9px); }
    }
    .acts { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
    .enter {
      display: inline-flex;
      align-items: center;
      height: 46px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
    }
    .become {
      height: 36px;
      padding: 0 14px;
      border: 1px solid color-mix(in srgb, var(--accent) 46%, var(--line));
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 10%, var(--panel));
      color: var(--accent);
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .one {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px;
      text-align: center;
    }
    .one-in { width: min(32rem, 100%); margin: auto 0; padding: 72px 0 40px; }
    h1 { margin: 0; font-family: var(--serif); font-size: 46px; font-weight: 600; letter-spacing: 0.06em; line-height: 1.15; }
    .kind { margin: 10px 0 0; font-size: 14px; letter-spacing: 0.04em; color: var(--muted); }
    .claim { margin: 36px 0 0; font-family: var(--serif); font-size: 28px; font-weight: 600; letter-spacing: 0.04em; line-height: 1.4; }
    .one .acts { margin-top: 32px; }
    .state { display: inline-flex; align-items: center; gap: 8px; margin: 26px 0 0; font-size: 13px; color: var(--muted); }
    .state i { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot) 18%, transparent); }
    .fine { margin: 0; padding: 0 0 22px; font-size: 12px; color: var(--faint); text-wrap: balance; }
    @media (max-width: 640px) {
      h1 { font-size: 40px; }
      .claim { font-size: 23px; }
    }
  </style>
</head>
<body data-presence="awake">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="pleat" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12.00 9.60Q13.83 4.58 18.17 4.13A1.20 1.20 0 0 1 19.87 5.83Q14.24 6.48 12.00 9.60ZM13.54 10.16Q18.17 7.50 21.79 9.94A1.20 1.20 0 0 1 21.99 12.33Q17.27 9.21 13.54 10.16ZM14.36 11.58Q19.62 12.52 20.82 16.71A1.20 1.20 0 0 1 19.45 18.68Q17.83 13.25 14.36 11.58ZM14.08 13.20Q17.51 17.30 15.73 21.28A1.20 1.20 0 0 1 13.41 21.90Q15.66 16.70 14.08 13.20ZM12.82 14.26Q12.82 19.60 8.89 21.50A1.20 1.20 0 0 1 6.72 20.49Q11.78 17.96 12.82 14.26ZM11.18 14.26Q7.74 18.34 3.51 17.28A1.20 1.20 0 0 1 2.50 15.11Q8.00 16.42 11.18 14.26ZM9.92 13.20Q4.66 14.12 2.10 10.59A1.20 1.20 0 0 1 2.72 8.27Q6.10 12.82 9.92 13.20ZM9.64 11.58Q5.01 8.91 5.32 4.55A1.20 1.20 0 0 1 7.29 3.18Q6.95 8.83 9.64 11.58ZM10.46 10.16Q8.64 5.14 11.67 2.01A1.20 1.20 0 0 1 14.06 2.21Q10.17 6.33 10.46 10.16Z"/>
      <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
    </symbol>
  </svg>
  <main class="one">
    <div class="one-in">
      <div class="bun" aria-hidden="true">
        <svg class="steam" viewBox="0 0 46 32"><path d="M14 30c-4-5 4-8 0-13s4-8 0-13"/><path d="M23 30c-4-5 4-8 0-13s4-8 0-13"/><path d="M32 30c-4-5 4-8 0-13s4-8 0-13"/></svg>
        <svg class="mark"><use href="#pleat"/></svg>
      </div>
      <h1>糖包</h1>
      <p class="kind">能工智人（Average Individual）</p>
      <p class="claim">回复你的是一个真人。</p>
      <div class="acts">
        <a class="enter" href="#chat">进入聊天</a>
        <button class="become" type="button">成为AI</button>
      </div>
      <p class="state"><i></i><span data-when="awake">他醒着。现在发消息，他会看到。</span><span data-when="asleep" hidden>他睡了。消息会留到他醒来。</span></p>
    </div>
    <p class="fine">糖包会犯错，重要的事请自己判断。不提供医疗、法律或危机援助。</p>
  </main>
  <script>
    const presence = new URLSearchParams(location.search).get("presence") === "asleep" ? "asleep" : "awake";
    document.body.dataset.presence = presence;
    document.querySelectorAll("[data-when]").forEach((el) => {
      el.hidden = el.dataset.when !== presence;
    });
  </script>
</body>
</html>
