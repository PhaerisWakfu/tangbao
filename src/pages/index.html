<!DOCTYPE html>
<!--
生产稿按 design/forks/07-steam.html 搬：06 的克制壳，加上热气和他睡着时的夜色。
从 08 捡了三样：推理核心、吞吐、可用性条，放进「已思考」的展开内容和关于页，数据都是真的。
05 太素，08 整页太吵，两稿和第一轮一起留在 design/forks/。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>糖包</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/tb-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/katex/katex.min.css">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/account.css">
</head>
<body data-state="empty" data-presence="awake">
  <script>
    try {
      if (localStorage.getItem("tangbao.presence") === "asleep") document.body.dataset.presence = "asleep";
    } catch {}
  </script>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="pleat" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12.00 9.60Q13.83 4.58 18.17 4.13A1.20 1.20 0 0 1 19.87 5.83Q14.24 6.48 12.00 9.60ZM13.54 10.16Q18.17 7.50 21.79 9.94A1.20 1.20 0 0 1 21.99 12.33Q17.27 9.21 13.54 10.16ZM14.36 11.58Q19.62 12.52 20.82 16.71A1.20 1.20 0 0 1 19.45 18.68Q17.83 13.25 14.36 11.58ZM14.08 13.20Q17.51 17.30 15.73 21.28A1.20 1.20 0 0 1 13.41 21.90Q15.66 16.70 14.08 13.20ZM12.82 14.26Q12.82 19.60 8.89 21.50A1.20 1.20 0 0 1 6.72 20.49Q11.78 17.96 12.82 14.26ZM11.18 14.26Q7.74 18.34 3.51 17.28A1.20 1.20 0 0 1 2.50 15.11Q8.00 16.42 11.18 14.26ZM9.92 13.20Q4.66 14.12 2.10 10.59A1.20 1.20 0 0 1 2.72 8.27Q6.10 12.82 9.92 13.20ZM9.64 11.58Q5.01 8.91 5.32 4.55A1.20 1.20 0 0 1 7.29 3.18Q6.95 8.83 9.64 11.58ZM10.46 10.16Q8.64 5.14 11.67 2.01A1.20 1.20 0 0 1 14.06 2.21Q10.17 6.33 10.46 10.16Z"/>
      <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></symbol>
    <symbol id="i-side" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="3"/><path d="M8 4.5v11"/></symbol>
    <symbol id="i-chev" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></symbol>
    <symbol id="i-up" viewBox="0 0 20 20"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></symbol>
    <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="9.5" height="9.5" rx="2.2"/><path d="M13 7V5.7A1.7 1.7 0 0 0 11.3 4H5.7A1.7 1.7 0 0 0 4 5.7v5.6A1.7 1.7 0 0 0 5.7 13H7"/></symbol>
    <symbol id="i-redo" viewBox="0 0 20 20"><path d="M15.6 7.6A6.2 6.2 0 1 0 16.2 12"/><path d="M16.2 4v3.8h-3.8"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m5 10.5 3.2 3.2L15 7"/></symbol>
    <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 9.3v4.4M10 6.6v.1"/></symbol>
    <symbol id="i-x" viewBox="0 0 20 20"><path d="m6 6 8 8M14 6l-8 8"/></symbol>
    <symbol id="i-image" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.5" cy="8" r="1.2"/><path d="m4 14 4-3.5 2.5 2 2-1.5L16 14"/></symbol>
    <symbol id="i-make" viewBox="0 0 20 20"><rect x="3" y="5" width="10.5" height="10" rx="1.8"/><path d="M16.2 2.8v3.2M14.6 4.4h3.2"/></symbol>
    <symbol id="i-down" viewBox="0 0 20 20"><path d="M10 3.5v8.2M6.4 8.6 10 12.2l3.6-3.6"/><path d="M4.5 16h11"/></symbol>
  </svg>

  <div class="app">
    <aside class="side" id="side">
      <div class="side-top">
        <a class="brand" href="/"><svg class="mark"><use href="#pleat"/></svg>糖包</a>
        <button class="icon-btn only-narrow" type="button" id="close-side" aria-label="收起侧栏"><svg class="i"><use href="#i-side"/></svg></button>
      </div>
      <button class="new" type="button" id="new"><span class="plus"><svg class="i"><use href="#i-plus"/></svg></span>新对话</button>
      <nav class="hist" id="history" aria-label="对话"></nav>
      <div class="side-foot">
        <a href="/about"><svg class="mark" aria-hidden="true"><use href="#pleat"/></svg><span><b>关于模型</b><small>规格卡</small></span></a>
      </div>
    </aside>
    <button class="scrim" type="button" id="scrim" aria-label="关闭侧栏"></button>

    <main class="main">
      <header class="top">
        <button class="icon-btn only-narrow" type="button" id="open-side" aria-label="打开侧栏"><svg class="i"><use href="#i-side"/></svg></button>
        <span class="title" id="title"></span>
        <button class="account-open" type="button" data-account-open>登录 / 注册</button>
        <a class="apply-top" href="/?apply=1">成为AI</a>
        <span class="status" id="status"><i></i><span id="status-label">Auto</span></span>
        <button class="icon-btn only-narrow" type="button" id="new-top" aria-label="新对话"><svg class="i"><use href="#i-plus"/></svg></button>
      </header>

      <section class="stage" id="stage">
        <div class="hello">
          <div class="bun" aria-hidden="true">
            <svg class="steam" viewBox="0 0 46 32"><path d="M14 30c-4-5 4-8 0-13s4-8 0-13"/><path d="M23 30c-4-5 4-8 0-13s4-8 0-13"/><path d="M32 30c-4-5 4-8 0-13s4-8 0-13"/></svg>
            <svg class="mark"><use href="#pleat"/></svg>
          </div>
          <h1>需要我做什么？</h1>
        </div>
        <div class="log" id="log" aria-live="polite"></div>
      </section>

      <div class="dock">
        <p class="sys" id="sys" role="status" hidden></p>
        <form class="composer" id="composer">
          <label class="sr" for="input">消息</label>
          <div class="attach" id="attach" hidden></div>
          <div class="make" id="make" hidden>
            <svg class="i"><use href="#i-make"/></svg>
            <span>制作图片</span>
            <button type="button" id="make-off" aria-label="退出制作图片">×</button>
          </div>
          <textarea id="input" rows="1" placeholder="给糖包发消息"></textarea>
          <div class="bar">
            <div class="plus">
              <button class="plus-btn" type="button" id="plus" aria-expanded="false" aria-controls="plus-menu" aria-label="添加"><svg class="i"><use href="#i-plus"/></svg></button>
              <div class="plus-menu" id="plus-menu" hidden>
                <button type="button" id="pick-image"><svg class="i"><use href="#i-image"/></svg><span>添加图片<small>从计算机上传，也可 Ctrl+V 粘贴</small></span></button>
                <div class="plus-rule" role="separator"></div>
                <button type="button" id="make-image"><svg class="i"><use href="#i-make"/></svg><span>制作图片<small>文生图创作图片</small></span></button>
              </div>
            </div>
            <input class="sr" id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
            <button class="model" type="button" id="model" aria-expanded="false" aria-controls="card"><span id="model-name">tangbao-vme50-flash</span><svg class="i"><use href="#i-chev"/></svg></button>
            <button class="send" type="submit" aria-label="发送" disabled><svg class="i"><use href="#i-up"/></svg></button>
          </div>
          <div class="card" id="card" hidden>
            <header>
              <svg class="mark"><use href="#pleat"/></svg>
              <div><h2>糖包</h2><p>「能工智人」大模型</p></div>
            </header>
            <label class="model-search" for="model-search">
              <input id="model-search" type="search" placeholder="搜索型号或简介" autocomplete="off" spellcheck="false" aria-label="搜索型号或简介">
            </label>
            <div class="model-list" id="model-list"></div>
          </div>
        </form>
        <div class="chips" id="chips">
          <button type="button">How are you</button>
          <button type="button">哈基米</button>
          <button type="button">咕咕</button>
          <button type="button">锟斤拷</button>
        </div>
      </div>
      <p class="fine">糖包也会犯错。重要的事请自己判断。<span>这里的 AI 是「<b>能工智人</b>」，回复的是一个<b>叫糖包的人</b>。不是医疗、法律或危机援助。注意文明用语，禁止发送骂人、敏感与色情内容。</span><button class="report-link" type="button" id="report-open" hidden>举报模型</button></p>
    </main>
  </div>

  <div class="apply" id="report" hidden>
    <div class="apply-card report-card" role="dialog" aria-modal="true" aria-labelledby="report-title">
      <header>
        <h2 id="report-title">举报模型</h2>
        <button type="button" id="report-close" aria-label="关闭">×</button>
      </header>
      <p class="report-lead">只用于举报模型的不当回复。请写清楚发生了什么。</p>
      <p class="report-target" id="report-target"></p>
      <label class="field">
        <span>举报原因</span>
        <textarea id="report-reason" maxlength="500" rows="4" placeholder="发生了什么？"></textarea>
        <small>最多 500 字。</small>
      </label>
      <button class="primary" type="button" id="report-submit">提交举报</button>
      <p class="err" id="report-err" role="alert"></p>
    </div>
  </div>

  <div class="viewer" id="viewer" hidden>
    <button type="button" id="viewer-x" aria-label="关闭">×</button>
    <img id="viewer-img" alt="">
  </div>
  <script src="/assets/katex/katex.min.js"></script>
  <script src="/assets/katex/auto-render.min.js"></script>
  <script src="/assets/md.js"></script>
  <script src="/assets/account.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
