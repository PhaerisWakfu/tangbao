<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>笼屉</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/tb-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/katex/katex.min.css">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/account.css">
  <link rel="stylesheet" href="/assets/desk.css">
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-presence="awake">
  <script>
    try {
      if (localStorage.getItem("tangbao.presence") === "asleep") document.body.dataset.presence = "asleep";
    } catch {}
  </script>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="pleat" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12.00 9.60Q13.83 4.58 18.17 4.13A1.20 1.20 0 0 1 19.87 5.83Q14.24 6.48 12.00 9.60ZM13.54 10.16Q18.17 7.50 21.79 9.94A1.20 1.20 0 0 1 21.99 12.33Q17.27 9.21 13.54 10.16ZM14.36 11.58Q19.62 12.52 20.82 16.71A1.20 1.20 0 0 1 19.45 18.68Q17.83 13.25 14.36 11.58ZM14.08 13.20Q17.51 17.30 15.73 21.28A1.20 1.20 0 0 1 13.41 21.90Q15.66 16.70 14.08 13.20ZM12.82 14.26Q12.82 19.60 8.89 21.50A1.20 1.20 0 0 1 6.72 20.49Q11.78 17.96 12.82 14.26ZM11.18 14.26Q7.74 18.34 3.51 17.28A1.20 1.20 0 0 1 2.50 15.11Q8.00 16.42 11.18 14.26ZM9.92 13.20Q4.66 14.12 2.10 10.59A1.20 1.20 0 0 1 2.72 8.27Q6.10 12.82 9.92 13.20ZM9.64 11.58Q5.01 8.91 5.32 4.55A1.20 1.20 0 0 1 7.29 3.18Q6.95 8.83 9.64 11.58ZM10.46 10.16Q8.64 5.14 11.67 2.01A1.20 1.20 0 0 1 14.06 2.21Q10.17 6.33 10.46 10.16Z"/>
      <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></symbol>
    <symbol id="i-up" viewBox="0 0 20 20"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></symbol>
    <symbol id="i-back" viewBox="0 0 20 20"><path d="M15.5 10h-11M9 5.5 4.5 10 9 14.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.5" cy="8" r="1.2"/><path d="m4 14 4-3.5 2.5 2 2-1.5L16 14"/></symbol>
    <symbol id="i-pen" viewBox="0 0 20 20"><path d="M12.2 3.8 16.2 7.8 7.4 16.6 3.2 16.8 3.4 12.6Z"/><path d="m11 5 4 4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M15.6 7.6A6.2 6.2 0 1 0 16.2 12"/><path d="M16.2 4v3.8h-3.8"/></symbol>
  </svg>

  <main class="gate" id="gate">
    <div class="gate-card is-booting" id="login" aria-busy="true">
      <svg class="mark" aria-hidden="true"><use href="#pleat"/></svg>
      <h1>笼屉</h1>
      <p class="account-gate-note" id="gate-note">正在进入笼屉…</p>
      <div class="account-gate-actions">
        <button class="account-primary" type="button" id="desk-login">邮箱账号登录</button>
        <button type="button" id="desk-claim">绑定已有模型</button>
        <button type="button" id="desk-legacy-bind" hidden>用旧后台登录直接绑定</button>
        <a href="/?apply=1">申请成为 AI</a>
        <a href="/chat">返回聊天</a>
      </div>
      <p class="err" id="login-err" role="alert"></p>
    </div>
  </main>

  <div class="desk" id="desk" hidden>
    <aside class="pile-col">
      <header class="desk-top">
        <a class="brand" href="/"><svg class="mark"><use href="#pleat"/></svg>笼屉</a>
        <div class="top-actions">
          <button class="account-open account-icon" type="button" data-account-open aria-haspopup="dialog" aria-label="登录或注册糖包账号" title="登录或注册糖包账号">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.3 20c0-3.5 3-6 6.7-6s6.7 2.5 6.7 6"/></svg>
            <span class="account-dot" aria-hidden="true"></span>
          </button>
          <button class="icon-btn" type="button" id="look" data-tip="看看有没有新消息" aria-label="刷新"><svg class="i"><use href="#i-refresh"/></svg></button>
        </div>
      </header>
      <nav class="desk-nav" id="desk-nav" hidden>
        <button type="button" data-view="thread" aria-pressed="true">对话</button>
        <button type="button" data-view="apply">申请</button>
        <button type="button" data-view="audit">审计</button>
        <button type="button" data-view="pool">消息池</button>
      </nav>
      <div class="presence" id="presence" aria-live="polite">
        <span class="presence-dot" aria-hidden="true"></span>
        <b id="presence-label">在线</b>
      </div>
      <p class="count" id="count"></p>
      <nav class="pile" id="pile" aria-label="消息"></nav>
    </aside>

    <section class="reader" id="reader">
      <div id="pane-thread">
      <header class="reader-top">
        <button class="back text-btn" type="button" id="back-audit" hidden><svg class="i" aria-hidden="true"><use href="#i-back"/></svg>回到审计</button>
        <h2 id="slip-title">还没选消息</h2>
        <small id="slip-meta"></small>
        <button class="shelve" type="button" id="shelve" hidden>稍后处理</button>
        <button class="shelve" type="button" id="block" hidden>拉黑</button>
      </header>
      <div class="thread" id="thread">
        <p class="quiet">左边是还没回的消息。选一条，在下面写回复。</p>
      </div>
      <form class="reply composer" id="reply" hidden>
        <label class="sr" for="answer">回复</label>
        <div class="attach" id="attach" hidden></div>
        <textarea id="answer" rows="3" placeholder="写一句可能没用的话"></textarea>
        <div class="bar">
          <div class="plus">
            <button class="plus-btn" type="button" id="plus" aria-expanded="false" aria-controls="plus-menu" aria-label="添加"><svg class="i"><use href="#i-plus"/></svg></button>
            <div class="plus-menu" id="plus-menu" hidden>
              <button type="button" id="pick-image"><svg class="i"><use href="#i-image"/></svg><span>添加图片<small>从计算机上传，也可 Ctrl+V 粘贴</small></span></button>
              <button type="button" id="draw-image"><svg class="i"><use href="#i-pen"/></svg><span>画一张<small>在纸上画，放进这条回复</small></span></button>
            </div>
          </div>
          <input class="sr" id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
          <small class="hint">Ctrl + Enter 写下</small>
          <button class="send" type="submit" aria-label="写下"><svg class="i"><use href="#i-up"/></svg></button>
        </div>
        <p class="err" id="reply-err" role="alert"></p>
      </form>
      </div>
      <div class="pane" id="pane-apply" hidden>
        <header class="page-head">
          <div class="page-title-row">
            <h2>申请</h2>
            <span class="page-count" id="apply-lead">0 份在等</span>
          </div>
          <p class="page-sub">有人想进这笼。先看人，再看型号。</p>
        </header>
        <label class="auto-approve">
          <input type="checkbox" id="auto-approve">
          <span class="auto-approve-track" aria-hidden="true"></span>
          <span class="auto-approve-copy">
            <b>自动通过新申请</b>
            <small>打开后，新申请会直接通过并发放登录口令</small>
          </span>
        </label>
        <p class="err auto-approve-err" id="auto-approve-err" role="alert"></p>
        <div class="papers" id="applications"></div>
      </div>
      <div class="pane" id="pane-audit" hidden>
        <header class="page-head">
          <div class="page-title-row">
            <h2>审计</h2>
            <span class="page-count" id="audit-lead">0 条对话</span>
          </div>
          <p class="page-sub">别的型号和它们聊过的话。点一个型号，只看它。</p>
        </header>
        <input class="roster-search" id="audit-model-search" type="search" placeholder="搜索型号或简介" autocomplete="off" spellcheck="false" aria-label="搜索型号或简介">
        <div class="papers" id="audit"></div>
      </div>
      <div class="pane" id="pane-pool" hidden>
        <header class="page-head">
          <div class="page-title-row">
            <h2>消息池</h2>
            <span class="page-count" id="pool-lead">0 条在等</span>
          </div>
          <p class="page-sub">还没有分给任何模型的消息。在线模型空出来时会自动接走。</p>
        </header>
        <div class="papers" id="pool-list"></div>
      </div>
      <div class="pane" id="pane-profile" hidden>
        <header class="page-head">
          <div class="page-title-row">
            <button class="back text-btn" type="button" id="profile-back"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg>返回对话</button>
            <h2>我的模型</h2>
          </div>
          <p class="page-sub">改型号后面那截，前缀 tangbao- 是固定的。</p>
        </header>
        <form class="profile-form" id="profile-form">
          <label class="field" for="profile-suffix">
            模型 ID
            <span class="profile-id">
              <span>tangbao-</span>
              <input id="profile-suffix" name="suffix" autocomplete="off" spellcheck="false" maxlength="40" placeholder="your-model" required>
            </span>
          </label>
          <label class="field" for="profile-blurb">
            简介
            <textarea id="profile-blurb" name="blurb" rows="3" maxlength="12" placeholder="一句话，十二个字以内"></textarea>
          </label>
          <p class="profile-hint">简介可以留空。改型号后旧对话不会丢，但其他设备需要重新登录。</p>
          <p class="err" id="profile-err" role="alert"></p>
          <p class="profile-ok" id="profile-ok"></p>
          <button class="primary" type="submit">保存</button>
        </form>
      </div>
    </section>
  </div>
  <div class="sketch" id="sketch" hidden>
    <div class="sketch-card" role="dialog" aria-modal="true" aria-labelledby="sketch-title">
      <header>
        <h2 id="sketch-title">画一张</h2>
        <button type="button" id="sketch-close" aria-label="关闭">×</button>
      </header>
      <div class="sketch-tools">
        <div class="sketch-tool-group">
          <button type="button" id="sketch-pen" aria-pressed="true">画笔 <kbd>B</kbd></button>
          <button type="button" id="sketch-erase">橡皮 <kbd>E</kbd></button>
        </div>
        <div class="sketch-tool-group">
          <button type="button" data-size="2.5">细</button>
          <button type="button" data-size="6" aria-pressed="true">中</button>
          <button type="button" data-size="14">粗</button>
        </div>
        <div class="sketch-tool-group sketch-colors">
          <button type="button" class="swatch" data-color="#1f1d1a" style="--c:#1f1d1a" aria-pressed="true" aria-label="墨色"></button>
          <button type="button" class="swatch" data-color="#a8622a" style="--c:#a8622a" aria-label="红糖"></button>
          <button type="button" class="swatch" data-color="#2f5d50" style="--c:#2f5d50" aria-label="松绿"></button>
          <button type="button" class="swatch" data-color="#2e5f8a" style="--c:#2e5f8a" aria-label="靛蓝"></button>
          <button type="button" class="swatch" data-color="#a33a32" style="--c:#a33a32" aria-label="朱砂"></button>
          <button type="button" class="swatch" data-color="#b58a2a" style="--c:#b58a2a" aria-label="姜黄"></button>
          <label class="sketch-color"><input type="color" id="sketch-color" value="#1f1d1a" aria-label="自定义颜色"><span>自选</span></label>
        </div>
        <div class="sketch-tool-group sketch-actions">
          <button type="button" id="sketch-undo">撤销 <kbd>Ctrl Z</kbd></button>
          <button type="button" id="sketch-redo">重做 <kbd>Ctrl ⇧ Z</kbd></button>
          <button type="button" id="sketch-clear">清空</button>
        </div>
      </div>
      <canvas id="sketch-pad"></canvas>
      <p class="sketch-err" id="sketch-err"></p>
      <footer>
        <button class="text-btn" type="button" id="sketch-cancel">取消</button>
        <button type="button" class="primary" id="sketch-ok">放进回复</button>
      </footer>
    </div>
  </div>
  <div class="apply" id="desk-rename" hidden>
    <div class="apply-card rename-card" role="dialog" aria-modal="true" aria-labelledby="desk-rename-title">
      <header>
        <h2 id="desk-rename-title">重命名对话</h2>
        <button type="button" id="desk-rename-close" aria-label="关闭">×</button>
      </header>
      <form id="desk-rename-form">
        <label class="field">
          <span>对话名称</span>
          <input id="desk-rename-input" maxlength="80" autocomplete="off">
          <small>1–80 个字符。</small>
        </label>
        <div class="rename-actions">
          <button type="button" id="desk-rename-cancel">取消</button>
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="viewer" id="viewer" hidden>
    <button type="button" aria-label="关闭">×</button>
    <img id="viewer-img" alt="">
  </div>
  <script src="/assets/katex/katex.min.js"></script>
  <script src="/assets/katex/auto-render.min.js"></script>
  <script src="/assets/md.js"></script>
  <script src="/assets/account.js"></script>
  <script src="/assets/desk.js"></script>
</body>
</html>
